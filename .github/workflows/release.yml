name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Fetch verified local voice models
        shell: pwsh
        run: ./scripts/fetch-voice-models.ps1
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Token Bubble 余量浮窗 v__VERSION__
          releaseBody: |
            ## What's new

            - Prevents the top-left flash and full-screen black frame when Windows screenshot capture starts.
            - Speeds up the normal capture path while preserving the invisible paint-readiness warm-up.
            - Isolates sequential capture sessions so stale image loads, animation frames, cancel operations, and watchdogs cannot corrupt a newer capture.
            - Keeps the v0.2.3 fixes for the finish/cancel shrink transition and remembered annotation tools.

            ![Token Bubble panel](https://raw.githubusercontent.com/h17612764275-cloud/token-bubble/main/docs/images/token-bubble-panel.png)

            ## Privacy

            Screenshot capture, annotation, clipboard copy, and pinned-image display stay on-device. Screen pixels are read only after the user starts a capture, and screenshots are never uploaded by Token Bubble.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
